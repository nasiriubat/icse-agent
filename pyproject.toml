[project]
name = "memcheck"
version = "0.1.0"
description = "Contract-driven testing, fault injection, and repair for persistent LLM agent memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.15.1",
    "pydantic>=2.10.4",
    "pyyaml>=6.0.2",
    "pandas>=2.2.3",
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "rich>=13.9.4",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.42.0"]
openai = ["openai>=1.59.0"]
embeddings = ["sentence-transformers>=3.3.1"]
parquet = ["pyarrow>=18.1.0"]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.123.2",
    "ruff>=0.8.6",
    "mypy>=1.14.1",
    "pandas-stubs>=2.2.3.241126",
    "types-PyYAML>=6.0.12.20241230",
]

[project.scripts]
memcheck = "memcheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memcheck"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "N818", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# 3.12 so numpy's bundled stubs (which use PEP 695 `type` statements) parse. The package itself
# still targets 3.11+; the CI matrix runs the test suite on both.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pandas.*", "hypothesis.*", "yaml.*"]
ignore_missing_imports = true

# Provider SDKs are optional extras and are imported lazily inside a try/except, so a checkout
# without them must still type-check.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: integration tests using local/mock components only",
    "property: hypothesis property-based tests",
]
filterwarnings = ["ignore::DeprecationWarning"]
