# RepoEvolutionBench: eight multi-session software-engineering scenarios graded by unit tests.
# This is the configuration behind RQ2's downstream-action evidence.
name: repo_evolution
description: >
  Eight scenarios in which a project decision is made and later changed. At the final checkpoint
  the agent must patch a repository using the project's current decision; grading is the
  repository's own pytest suite, with no judge model anywhere in the loop.

backends:
  - no_memory
  - full_history
  - transcript_rag
  - guarded_memory

ablations:
  - abl_no_supersession
  - abl_no_tombstones

workload:
  name: repo_evolution
  version: v1

model:
  provider: mock
  identifier: oracle-reader-v1
  temperature: 0.0
  max_output_tokens: 256
  context_limit_tokens: 8192
  system_prompt_id: answer_v1

retrieval:
  mode: lexical
  evidence_budget: 5
  token_budget: 512
  min_confidence: 0.35
  abstain_on_conflict: true

faults:
  - none

contracts:
  - all

checkpoints: [0.50, 1.00]
seeds: [1]
repetitions: 1

cost:
  limit_usd: 0.0
  pricing_file: configs/pricing.example.yaml

output:
  results_dir: results/raw

notes: >
  The coding tasks are controlled probes of whether current project state reached the patch, not
  a general software-engineering benchmark; every edit is deliberately small so a failure is
  attributable to memory rather than to coding ability.
